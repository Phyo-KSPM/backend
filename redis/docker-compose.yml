services:
  redis:
    image: redis:7-alpine
    container_name: ceir-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ceir_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ceir-net

volumes:
  ceir_redis_data:

networks:
  ceir-net:
    name: ceir-net
    driver: bridge
